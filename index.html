<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portal</title>
<meta name="theme-color" content="#030303">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #030303; overflow: hidden; }
body {
  font-family: "Outfit", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: #c0c0c0;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.disco-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.disco-light-1 {
  position: absolute;
  left: 0;
  top: 0;
  width: 560px;
  height: 1280px;
  transform: translateY(-350px) rotate(-45deg);
  border-radius: 9999px;
  background: radial-gradient(68.54% 68.72% at 55.02% 31.46%, hsla(0,0%,85%,.08) 0, hsla(0,0%,55%,.02) 50%, hsla(0,0%,45%,0) 80%);
}
.disco-light-2 {
  position: absolute;
  left: 0;
  top: 0;
  width: 240px;
  height: 1280px;
  transform: translate(5%, -50%) rotate(-45deg);
  border-radius: 9999px;
  background: radial-gradient(50% 50% at 50% 50%, hsla(0,0%,85%,.06) 0, hsla(0,0%,45%,.02) 80%, transparent 100%);
}
.disco-light-3 {
  position: absolute;
  left: 0;
  top: 0;
  width: 240px;
  height: 1280px;
  transform: translateY(-350px) rotate(-45deg);
  background: radial-gradient(50% 50% at 50% 50%, hsla(0,0%,85%,.04) 0, hsla(0,0%,45%,.02) 80%, transparent 100%);
}
.content {
  z-index: 10;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 320px;
  padding: 0 20px;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 1.8s cubic-bezier(.16,.8,.24,1) 0.1s, transform 1.8s cubic-bezier(.16,.8,.24,1) 0.1s;
}
body.revealed .content {
  opacity: 1;
  transform: none;
}
.login-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 26px;
}
.field-group {
  position: relative;
  width: 100%;
}
.input-field {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding: 10px 4px;
  font-family: "Outfit", sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.08em;
  color: #fff;
  outline: none;
  text-align: center;
  text-shadow: -.5px 0 rgba(255,70,90,.4), .5px 0 rgba(70,200,255,.4), 0 0 12px rgba(170,190,255,.2);
  transition: border-color .3s, text-shadow .3s;
}
.input-field::placeholder {
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.1em;
  text-shadow: none;
  transition: opacity .3s;
}
.input-field:focus::placeholder {
  opacity: 0.1;
}
.field-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(220,230,255,.8), transparent);
  transform: scaleX(0);
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
}
.input-field:focus + .field-line,
.input-field:hover + .field-line {
  transform: scaleX(1);
}
.input-field:focus {
  text-shadow: -.5px 0 rgba(255,70,90,.6), .5px 0 rgba(70,200,255,.6), 0 0 14px rgba(255,255,255,.4);
}
.submit-wrap {
  margin-top: 8px;
  display: flex;
  justify-content: center;
}
.submit-btn {
  background: none;
  border: none;
  color: #fff;
  font-family: "Outfit", sans-serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.12em;
  padding: 8px 16px;
  cursor: pointer;
  position: relative;
  text-shadow: -.5px 0 rgba(255,70,90,.4), .5px 0 rgba(70,200,255,.4), 0 0 12px rgba(170,190,255,.2);
  opacity: .85;
  transition: opacity .3s, text-shadow .3s;
}
.submit-btn::after {
  content: "";
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(220,230,255,.8), transparent);
  transform: scaleX(0);
  transition: transform .5s cubic-bezier(.2,.8,.2,1);
}
.submit-btn:hover::after, .submit-btn:focus-visible::after {
  transform: scaleX(1);
}
.submit-btn:hover, .submit-btn:focus-visible {
  opacity: 1;
  outline: none;
  text-shadow: -.5px 0 rgba(255,70,90,.6), .5px 0 rgba(70,200,255,.6), 0 0 14px rgba(255,255,255,.4);
}
.submit-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
</style>
</head>
<body>
<div class="disco-bg" aria-hidden="true">
  <div class="disco-light-1"></div>
  <div class="disco-light-2"></div>
  <div class="disco-light-3"></div>
</div>
<div class="content">
  <form class="login-form" id="loginForm" autocomplete="off" onsubmit="return false;">
    <div class="field-group">
      <input type="text" id="username" class="input-field" placeholder="username" spellcheck="false" autocomplete="username" required>
      <div class="field-line"></div>
    </div>
    <div class="field-group">
      <input type="password" id="password" class="input-field" placeholder="password" autocomplete="current-password" required>
      <div class="field-line"></div>
    </div>
    <div class="submit-wrap">
      <button type="submit" id="submitBtn" class="submit-btn">unlock</button>
    </div>
  </form>
</div>

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.body.classList.add('revealed'), 80);
  const cached = getCookie('nc_key');
  if (cached) {
    tryAutoDecrypt(cached);
  }
});
const form = document.getElementById('loginForm');
const userIn = document.getElementById('username');
const passIn = document.getElementById('password');
const subBtn = document.getElementById('submitBtn');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = userIn.value.trim();
  const p = passIn.value;
  if (!u || !p) return;
  await attemptUnlock(u + '|' + p, true);
});
async function attemptUnlock(passphrase, saveCookie) {
  setBusy(true);
  try {
    const key = await deriveKey(passphrase, PAYLOAD.salt, PAYLOAD.iterations);
    const html = await decryptPayload(key, PAYLOAD.iv, PAYLOAD.ciphertext);
    if (saveCookie) {
      setCookie('nc_key', passphrase, 30);
    }
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    setBusy(false);
    deleteCookie('nc_key');
  }
}
async function tryAutoDecrypt(passphrase) {
  setBusy(true);
  try {
    const key = await deriveKey(passphrase, PAYLOAD.salt, PAYLOAD.iterations);
    const html = await decryptPayload(key, PAYLOAD.iv, PAYLOAD.ciphertext);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    setBusy(false);
    deleteCookie('nc_key');
  }
}
function setBusy(b) {
  subBtn.disabled = b;
  userIn.disabled = b;
  passIn.disabled = b;
}
function b64ToBuf(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
async function deriveKey(passphrase, saltB64, iterations) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw',
    enc.encode(passphrase),
    { name: 'PBKDF2' },
    false,
    ['deriveKey']
  );
  return await crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: b64ToBuf(saltB64),
      iterations: iterations,
      hash: 'SHA-256'
    },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}
async function decryptPayload(key, ivB64, ctB64) {
  const plainBuf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBuf(ivB64) },
    key,
    b64ToBuf(ctB64)
  );
  return new TextDecoder().decode(plainBuf);
}
function setCookie(n, v, d) {
  const exp = new Date(Date.now() + d * 864e5).toUTCString();
  document.cookie = encodeURIComponent(n) + '=' + encodeURIComponent(v) + '; expires=' + exp + '; path=/; SameSite=Lax';
}
function getCookie(n) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + encodeURIComponent(n) + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function deleteCookie(n) {
  document.cookie = encodeURIComponent(n) + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax';
}
