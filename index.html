<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightcore Studio — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#08090b;
  --bg-1:#0d0f13;
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.02);
  --border:rgba(255,255,255,.09);
  --border-soft:rgba(255,255,255,.05);
  --text:#e8e9ee;
  --text-dim:#93969f;
  --text-faint:#54565f;
  --accent:#c9a15a;
  --accent-soft:rgba(201,161,90,.12);
  --danger:#c96a6a;
  --danger-soft:rgba(201,106,106,.12);
  --success:#7fae8e;
  --success-soft:rgba(127,174,142,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg-0);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---- ambient background ---- */
.bg-field{position:fixed;inset:0;z-index:0;pointer-events:none;}
.bg-field .glow{
  position:absolute;width:70vw;height:70vw;max-width:900px;max-height:900px;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(201,161,90,.05) 0%, rgba(201,161,90,0) 60%);
  animation:driftGlow 22s ease-in-out infinite;
}
@keyframes driftGlow{
  0%,100%{transform:translate(-52%,-48%) scale(1);}
  50%{transform:translate(-48%,-52%) scale(1.08);}
}
.bg-field .grain{
  position:absolute;inset:-10%;opacity:.035;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.bg-field .vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(4,4,6,.55) 100%);
}

/* ---- card ---- */
.gate{
  position:relative;z-index:1;
  width:100%;max-width:380px;
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--border);
  border-radius:20px;
  padding:38px 34px 32px;
  box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
  opacity:0;
  animation:cardIn .7s cubic-bezier(.16,1,.3,1) forwards;
  transition:opacity .5s ease, transform .5s ease, filter .5s ease;
}
@keyframes cardIn{
  from{opacity:0; transform:translateY(10px) scale(.98);}
  to{opacity:1; transform:translateY(0) scale(1);}
}
.gate.leaving{opacity:0; transform:translateY(-6px) scale(.97); filter:blur(4px);}
.gate.shake{animation:shake .45s ease;}
@keyframes shake{
  10%,90%{transform:translateX(-1px);}
  20%,80%{transform:translateX(2px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}

.seal{
  width:44px;height:44px;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--panel-2);
  position:relative;
  transition:border-color .3s, background .3s;
}
.seal svg{width:18px;height:18px;display:block;}
.seal .icon-lock,.seal .icon-unlock,.seal .icon-x{
  position:absolute;color:var(--text-dim);
  transition:opacity .3s, transform .3s;
}
.seal .icon-unlock,.seal .icon-x{opacity:0;transform:scale(.6);}
.seal.success{border-color:rgba(127,174,142,.5); background:var(--success-soft);}
.seal.success .icon-lock{opacity:0;transform:scale(.6);}
.seal.success .icon-unlock{opacity:1;transform:scale(1);color:var(--success);}
.seal.error{border-color:rgba(201,106,106,.5); background:var(--danger-soft);}
.seal.error .icon-lock{opacity:0;transform:scale(.6);}
.seal.error .icon-x{opacity:1;transform:scale(1);color:var(--danger);}
.seal-ring{
  position:absolute;inset:-6px;border-radius:50%;
  border:1px solid var(--success);
  opacity:0;
}
.seal.success .seal-ring{animation:ringPulse .7s ease-out forwards;}
@keyframes ringPulse{
  0%{opacity:.6;transform:scale(.8);}
  100%{opacity:0;transform:scale(1.6);}
}

.eyebrow{
  text-align:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:6px;
}
h1{
  text-align:center;
  font-size:18px;font-weight:600;letter-spacing:-.01em;
  margin:0 0 6px;color:var(--text);
}
.desc{
  text-align:center;font-size:12.5px;color:var(--text-dim);
  line-height:1.6;margin:0 0 28px;
}

label{
  display:block;font-size:11px;font-weight:600;letter-spacing:.03em;
  color:var(--text-dim);margin-bottom:7px;text-transform:uppercase;
}
.field{margin-bottom:16px;}
input[type=text],input[type=password]{
  width:100%;background:rgba(255,255,255,.03);
  border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px 14px;font-size:14px;
  font-family:'Inter',sans-serif;outline:none;
  transition:border-color .15s, background .15s;
}
input::placeholder{color:var(--text-faint);}
input:focus{border-color:rgba(201,161,90,.55); background:rgba(255,255,255,.045);}
input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

.pw-wrap{position:relative;}
.pw-wrap input{padding-right:44px;}
.pw-toggle{
  position:absolute;top:0;right:0;bottom:0;width:40px;
  display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--text-faint);cursor:pointer;
  padding:0;
}
.pw-toggle:hover{color:var(--text-dim);}
.pw-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.pw-toggle svg{width:16px;height:16px;}
.pw-toggle .icon-off{display:none;}
.pw-toggle.showing .icon-on{display:none;}
.pw-toggle.showing .icon-off{display:block;}

.remember-row{
  display:flex;align-items:center;gap:8px;margin:2px 0 20px;
  user-select:none;
}
.remember-row input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:15px;height:15px;flex:0 0 auto;
  border:1px solid var(--border);border-radius:4px;background:rgba(255,255,255,.03);
  cursor:pointer;position:relative;transition:background .15s,border-color .15s;
}
.remember-row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);}
.remember-row input[type=checkbox]:checked::after{
  content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid var(--bg-0);border-width:0 2px 2px 0;transform:rotate(40deg);
}
.remember-row input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.remember-row label{
  font-size:12.5px;font-weight:500;color:var(--text-dim);text-transform:none;
  letter-spacing:0;margin:0;cursor:pointer;
}

button.submit{
  width:100%;margin-top:2px;
  border:1px solid rgba(201,161,90,.4);
  border-radius:10px;padding:12px;
  font-size:13.5px;font-weight:600;letter-spacing:.02em;
  color:var(--bg-0);background:var(--accent);
  cursor:pointer;font-family:'Inter',sans-serif;
  transition:opacity .15s, transform .1s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
button.submit:hover{opacity:.92;}
button.submit:active{transform:scale(.99);}
button.submit:disabled{opacity:.55;cursor:not-allowed;}
button.submit:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.spinner{
  width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(8,9,11,.25);border-top-color:var(--bg-0);
  animation:spin .7s linear infinite;display:none;
}
button.loading .spinner{display:inline-block;}
button.loading .btn-label{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.status{
  min-height:16px;margin-top:16px;text-align:center;
  font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;
}
.status.error{color:var(--danger);}
.status.success{color:var(--success);}

.foot{
  margin-top:26px;padding-top:18px;border-top:1px solid var(--border-soft);
  text-align:center;font-size:10.5px;color:var(--text-faint);
  font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;
}

/* ---- auto-login (welcome back) state ---- */
.welcome{
  position:relative;z-index:1;text-align:center;
  display:none;opacity:0;
}
.welcome p{font-size:12.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;}

/* When a saved session cookie is detected, an inline script (see body)
   adds .has-session to <html> BEFORE the gate paints, so visitors with
   a remembered session never see the login form flash. */
html.has-session .gate{display:none;}
html.has-session .welcome{display:flex;flex-direction:column;align-items:center;
  animation:cardIn .5s cubic-bezier(.16,1,.3,1) forwards;}

@media (prefers-reduced-motion: reduce){
  .gate,.welcome,.bg-field .glow,.seal-ring,.spinner{animation:none !important;}
  .gate{opacity:1;transform:none;}
  html.has-session .welcome{opacity:1;}
}
</style>
</head>
<body>
<script>
/* Runs before the gate/welcome markup paints, so returning visitors
   with a saved session never see the login form appear and disappear. */
(function(){
  try{
    if(/(?:^|; )nc_key=([^;]*)/.test(document.cookie)){
      document.documentElement.classList.add('has-session');
    }
  }catch(e){}
})();
</script>

  </div>
  <p>Welcome back</p>
</div>

<div class="gate" id="gate">
  <div class="seal" id="seal">
    <div class="seal-ring"></div>
    <svg class="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    <svg class="icon-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 7.5-2"></path></svg>
    <svg class="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
  </div>
  <div class="eyebrow">Restricted Access</div>
  <h1>Nightcore Studio</h1>
  <p class="desc">This page is private. Sign in with your credentials to continue.</p>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" type="text" autocomplete="username" placeholder="Enter username" required>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <div class="pw-wrap">
        <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
          <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="remember">
      <label for="remember">Remember me on this device</label>
    </div>
    <button class="submit" id="submitBtn" type="submit">
      <span class="spinner"></span>
      <span class="btn-label">Unlock</span>
    </button>
    <div class="status" id="status"></div>
  </form>

  <div class="foot">Encrypted &middot; Client-side only</div>
</div>

const COOKIE_NAME = "nc_key";
const COOKIE_DAYS = 30;

function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToB64(bytes){
  let bin = "";
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function getCookie(name){
  const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return match ? decodeURIComponent(match[1]) : null;
}
function setCookie(name, value, days){
  const secure = location.protocol === 'https:' ? '; Secure' : '';
  document.cookie = name + '=' + encodeURIComponent(value) +
    '; path=/; max-age=' + (days*24*60*60) + '; SameSite=Strict' + secure;
}
function clearCookie(name){
  document.cookie = name + '=; path=/; max-age=0; SameSite=Strict';
}

async function deriveKeyFromPassphrase(passphrase, saltBytes, iterations, extractable){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(passphrase), {name:"PBKDF2"}, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt: saltBytes, iterations: iterations, hash:"SHA-256"},
    keyMaterial,
    {name:"AES-GCM", length:256},
    extractable,
    ["decrypt"]
  );
}
async function importRawKey(rawKeyB64){
  return crypto.subtle.importKey(
    "raw", b64ToBytes(rawKeyB64), {name:"AES-GCM", length:256}, false, ["decrypt"]
  );
}

function buildLogoutSnippet(){
  return '<button id="__ncLogout" type="button" aria-label="Log out" ' +
    'style="position:fixed;bottom:16px;right:16px;z-index:9999;' +
    'background:rgba(19,20,25,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);' +
    'border:1px solid rgba(255,255,255,.12);color:#93969f;font-size:11px;font-family:Inter,sans-serif;' +
    'padding:8px 14px;border-radius:980px;cursor:pointer;letter-spacing:.02em;">Log out</button>' +
    '<script>document.getElementById("__ncLogout").addEventListener("click",function(){' +
    'document.cookie="' + COOKIE_NAME + '=; path=/; max-age=0; SameSite=Strict";location.reload();' +
    '});<\/script>';
}

function revealContent(decodedHtml){
  const withLogout = decodedHtml.includes('</body>')
    ? decodedHtml.replace('</body>', buildLogoutSnippet() + '</body>')
    : decodedHtml + buildLogoutSnippet();
  document.open();
  document.write(withLogout);
  document.close();
}

async function tryAutoLogin(){
  const stored = getCookie(COOKIE_NAME);
  if(!stored) return false;
  try{
    const key = await importRawKey(stored);
    const ivBytes = b64ToBytes(ENC.iv);
    const ctBytes = b64ToBytes(ENC.ciphertext);
    const decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv: ivBytes}, key, ctBytes);
    const decodedHtml = new TextDecoder().decode(decrypted);
    setTimeout(()=> revealContent(decodedHtml), 550);
    return true;
  }catch(err){
    clearCookie(COOKIE_NAME);
    return false;
  }
}

  status.className = "status";
  status.textContent = "";
  btn.classList.add("loading");
  btn.disabled = true;

  await new Promise(r=>setTimeout(r, 350));

  try{
    const saltBytes = b64ToBytes(ENC.salt);
    const ivBytes = b64ToBytes(ENC.iv);
    const ctBytes = b64ToBytes(ENC.ciphertext);
    const key = await deriveKeyFromPassphrase(username + "|" + password, saltBytes, ENC.iterations, true);
    const decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv: ivBytes}, key, ctBytes);
    const decodedHtml = new TextDecoder().decode(decrypted);

    if(remember){
      const rawKey = await crypto.subtle.exportKey("raw", key);
      setCookie(COOKIE_NAME, bytesToB64(new Uint8Array(rawKey)), COOKIE_DAYS);
    }

    seal.classList.add("success");
    status.className = "status success";
    status.textContent = "Access granted";
    btn.classList.remove("loading");

    setTimeout(()=>{
      gate.classList.add("leaving");
      setTimeout(()=> revealContent(decodedHtml), 480);
    }, 550);

  }catch(err){
    seal.classList.add("error");
    gate.classList.add("shake");
    status.className = "status error";
    status.textContent = "Incorrect username or password";
    btn.classList.remove("loading");
    btn.disabled = false;
    setTimeout(()=>{ seal.classList.remove("error"); gate.classList.remove("shake"); }, 900);
  }
});

(async ()=>{
  if(document.documentElement.classList.contains('has-session')){
    const ok = await tryAutoLogin();
    if(!ok){
      document.documentElement.classList.remove('has-session');
      document.getElementById("u").focus();
    }
  }else{
    document.getElementById("u").focus();
  }
})();
</script>
